# The quality gate on every push and pull request: analyze, tests and the clean-architecture linter
# (revoockv-flutter-clean-arch). A pushed tag vX.Y.Z (or a manual run, "Run workflow" in the Actions tab) also
# builds the app for Android, macOS, Windows, Linux and the web; a tag attaches the builds to its GitHub release,
# a manual run keeps them as workflow artifacts.
name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - name: Get the architecture linter
        uses: actions/checkout@v4
        with:
          repository: revoockv/revoockv-flutter-clean-arch
          path: .clean-arch
      - run: python3 .clean-arch/scripts/dart_clean_arch_linter.py lib --strict

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: macos
            os: macos-latest
          - target: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      NAME: hitwave-cover-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get

      - name: Android APK
        if: matrix.target == 'android'
        run: |
          flutter build apk --release
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk "dist/$NAME.apk"
      - name: Web
        if: matrix.target == 'web'
        run: |
          flutter build web --release
          mkdir -p dist && (cd build/web && zip -qr "../../dist/$NAME.zip" .)
      - name: Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          mkdir -p dist && tar -czf "dist/$NAME.tar.gz" -C build/linux/x64/release/bundle .
      - name: macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          mkdir -p dist && ditto -c -k --keepParent "build/macos/Build/Products/Release/Hitwave Cover.app" "dist/$NAME.zip"
      - name: Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/$env:NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release with every build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag dist/*
